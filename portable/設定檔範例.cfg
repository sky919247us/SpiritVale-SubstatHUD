## ================================================================
##  這是「設定檔範例」，只是給你看的參考，不必手動複製到任何地方。
##
##  實際的設定檔會在你「安裝本 Mod 之後、第一次啟動遊戲」時，
##  由 BepInEx 自動生成在這個位置：
##
##      <遊戲目錄>\BepInEx\config\local.spiritvale.substathud.cfg
##
##  例如（Steam 預設路徑）：
##      C:\Program Files (x86)\Steam\steamapps\common\SpiritVale
##          \BepInEx\config\local.spiritvale.substathud.cfg
##
##  想調整設定的步驟：
##      1. 先開一次遊戲，讓它自動生成設定檔
##      2. 完全關閉遊戲
##      3. 用記事本開啟上面那個檔案，修改後存檔
##      4. 重新啟動遊戲即生效
##
##  下面是各項目的預設內容與說明。
## ================================================================
## Settings file was created by plugin SpiritVale Substat Quality HUD v1.3.0
## Plugin GUID: local.spiritvale.substathud

[1.功能]

## 在背包裝備名稱前加上 ★ 記號並上色，不必把滑鼠移上去就能篩選。
# Setting type: Boolean
# Default value: true
背包星號標記 = true

## 在道具說明開頭加一行品質總評。
# Setting type: Boolean
# Default value: true
彈窗顯示品質總評 = true

## 道具說明一律顯示詞條範圍，不必按 ALT。注意：這會干擾遊戲原本的按鍵對比裝備功能，故預設關閉。
# Setting type: Boolean
# Default value: false
自動顯示詞條範圍 = false

[2.分級門檻]

## true＝星號依『數值已達範圍上限的條數比例』計算，也就是你肉眼看到的滿素質。false＝依內部 roll 百分位平均計算，更精確反映稀有度，但會與肉眼所見不符（窄範圍詞條如 2~3，roll 六成就已經顯示為上限值）。
# Setting type: Boolean
# Default value: true
以顯示滿值為準 = true

## 達此比例標 ★★★（金色）。以顯示滿值為準時，1.00 代表每一條都頂到上限。
# Setting type: Single
# Default value: 1
三星 = 1

## 達此比例標 ★★（橘色）。
# Setting type: Single
# Default value: 0.75
二星 = 0.75

## 達此比例標 ★（紫色）。低於此值不標記。
# Setting type: Single
# Default value: 0.5
一星 = 0.5

[3.診斷]

## 在道具說明印出每個詞條的執行期真值並寫入 log。僅供除錯，平常請保持 false。
# Setting type: Boolean
# Default value: false
診斷模式 = false

